<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#020617" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>BALL VS KEEPER — Pad</title>
<style>
  /* ===== منع التكبير والتمرير والتحديد ===== */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; background: #020617; color: #fff;
    font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif; position: fixed; inset: 0; }
  button { font-family: inherit; }
  .hidden { display: none !important; }
  input { -webkit-user-select: text; user-select: text; touch-action: manipulation; }

  /* ===== شاشة الانضمام ===== */
  #join { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px;
    background: radial-gradient(circle at 50% 0%, #1e3a8a 0%, #020617 70%); overflow-y: auto; touch-action: pan-y; }
  #join h1 { margin: 0; font-size: 30px; font-weight: 900; text-align: center; color: #fcd34d; }
  #join .sub { color: #cbd5e1; margin-top: -8px; }
  .field { width: 100%; max-width: 360px; }
  .field label { display: block; font-weight: 700; margin-bottom: 6px; color: #e2e8f0; }
  .field input { width: 100%; font-size: 30px; padding: 12px; border-radius: 16px; border: 2px solid #334155; background: #0f172a; color: #fff; text-align: center; font-weight: 800; letter-spacing: 6px; }
  .field input#name { font-size: 20px; letter-spacing: 0; }
  .roles { display: flex; gap: 10px; width: 100%; max-width: 360px; }
  .roles button { flex: 1; padding: 16px 8px; font-size: 20px; font-weight: 800; border-radius: 16px; border: 3px solid transparent; background: #1e293b; color: #fff; }
  .roles button.on { border-color: #fcd34d; background: #334155; }
  .big { width: 100%; max-width: 360px; padding: 18px; font-size: 26px; font-weight: 900; border: 0; border-radius: 18px; background: linear-gradient(#fbbf24, #f97316); color: #0f172a; }
  #err { color: #fda4af; font-weight: 700; min-height: 22px; text-align: center; }
  .langbtn { position: absolute; top: 12px; inset-inline-end: 12px; padding: 8px 14px; border-radius: 12px; border: 0; background: rgba(255,255,255,.12); color: #fff; font-weight: 700; font-size: 16px; }

  /* ===== شاشة اليد ===== */
  #pad { position: absolute; inset: 0; display: flex; flex-direction: column; }
  #bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); background: linear-gradient(100deg, rgba(15,23,42,.98), rgba(30,41,59,.92)); border-bottom: 3px solid var(--pc, #f97316); font-weight: 800; box-shadow: 0 8px 28px #0005; }
  #dot { width: 14px; height: 14px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 10px #22c55e; }
  #who { color: var(--pc, #f97316); font-size: 18px; }
  #role { padding: 4px 12px; border-radius: 999px; background: rgba(255,255,255,.12); font-size: 16px; }
  #score { margin-inline-start: auto; font-size: 20px; direction: ltr; }
  .iconbtn { border: 0; background: rgba(255,255,255,.12); color: #fff; border-radius: 12px; font-size: 20px; padding: 6px 12px; }
  #area { flex: 1; position: relative; display: flex; direction: ltr; }
  #stickZone { flex: 1; position: relative; }
  #stickBase { position: absolute; width: 184px; height: 184px; margin: -92px 0 0 -92px; border-radius: 50%; border: 3px solid rgba(255,255,255,.32);
    background: radial-gradient(circle, rgba(255,255,255,.12), rgba(255,255,255,.025)); box-shadow: inset 0 0 28px #0005, 0 10px 35px #0004; left: 30%; top: 55%; pointer-events: none; }
  #stickKnob { position: absolute; width: 86px; height: 86px; margin: -43px 0 0 -43px; border-radius: 50%; left: 50%; top: 50%; border: 2px solid #ffffff66;
    background: radial-gradient(circle at 35% 30%, #fff9, var(--pc, #f97316)); box-shadow: 0 6px 24px rgba(0,0,0,.55), inset 0 2px 8px #fff5; will-change: transform; }
  #stickHint { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: #64748b; font-weight: 700; pointer-events: none; }
  #btnZone { flex: 1; position: relative; }
  .pbtn { position: absolute; border-radius: 50%; border: 2px solid #ffffff55; color: #fff; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-direction: column;
    box-shadow: 0 8px 0 rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.4), inset 0 3px 12px #ffffff30; transition: transform .05s, opacity .2s, filter .2s; touch-action: none; line-height: 1.1; user-select:none; -webkit-user-select:none; }
  .pbtn span { font-size: 34px; }
  .pbtn.down { transform: translateY(6px) scale(.95); box-shadow: 0 2px 0 rgba(0,0,0,.35); filter: brightness(1.25); }
  .pbtn.dim { opacity: .35; }
  #bShoot { width: 150px; height: 150px; right: 8%; bottom: 14%; background: radial-gradient(circle at 35% 30%, #86efac, #16a34a); font-size: 20px; }
  #bJump { width: 110px; height: 110px; right: 12%; top: 8%; background: radial-gradient(circle at 35% 30%, #fca5a5, #dc2626); font-size: 18px; }
  #bDive { width: 120px; height: 120px; right: 52%; bottom: 10%; background: radial-gradient(circle at 35% 30%, #93c5fd, #2563eb); font-size: 18px; }
  @media (orientation: portrait) {
    #area { flex-direction: column-reverse; }
    #bShoot { width: 130px; height: 130px; right: 8%; bottom: 10%; }
    #bJump { width: 96px; height: 96px; right: 10%; top: 6%; }
    #bDive { width: 104px; height: 104px; right: auto; left: 10%; bottom: 14%; }
    #stickBase { left: 50%; top: 50%; }
  }
  #overlay { position: absolute; inset: 0; background: rgba(2,6,23,.85); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; font-size: 24px; font-weight: 800; text-align: center; padding: 20px; z-index: 5; }
  .spin { width: 48px; height: 48px; border: 6px solid #334155; border-top-color: #fbbf24; border-radius: 50%; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  #navBar { position: absolute; inset: 0; top: 56px; z-index: 5; background: rgba(2,6,23,.94); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
  #navBar .row { display: flex; gap: 14px; direction: ltr; }
  #navBar button { width: 110px; height: 90px; border: 0; border-radius: 22px; font-size: 38px; font-weight: 900; color: #fff; background: #1e293b; box-shadow: 0 6px 0 #0008; }
  #navBar button:active { transform: translateY(4px); box-shadow: 0 2px 0 #0008; }
  #navBar button.ok { background: linear-gradient(#fbbf24, #f97316); color: #0f172a; width: 160px; }
  #navBar .tip { color: #94a3b8; font-weight: 700; text-align: center; }
  #rolePick { display: flex; gap: 8px; }
  #rolePick button { border: 0; padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,.12); color: #fff; font-weight: 800; font-size: 15px; }
  #rolePick button.on { background: var(--pc, #f97316); color: #0f172a; }
</style>
</head>
<body>
  <!-- ===== شاشة الانضمام ===== -->
  <div id="join">
    <button class="langbtn" id="langBtn">EN</button>
    <div style="font-size:54px">⚽🧤</div>
    <h1 data-t="title"></h1>
    <div class="sub" data-t="sub"></div>
    <div class="field"><label data-t="code"></label><input id="code" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000" /></div>
    <div class="field hidden" id="hostField"><label data-t="hostLbl"></label><input id="host" inputmode="decimal" autocomplete="off" placeholder="192.168.1.20:3000" style="font-size:22px;letter-spacing:0" /></div>
    <div class="field"><label data-t="name"></label><input id="name" maxlength="16" autocomplete="off" /></div>
    <div class="roles"><button id="rBall" data-t="rBall"></button><button id="rKeeper" data-t="rKeeper"></button></div>
    <button class="big" id="go" data-t="join"></button>
    <div id="err"></div>
  </div>

  <!-- ===== اليد ===== -->
  <div id="pad" class="hidden">
    <div id="bar">
      <div id="dot"></div>
      <div id="who"></div>
      <div id="role"></div>
      <div id="rolePick"><button id="pBall">⚽</button><button id="pKeeper">🧤</button></div>
      <div id="score"></div>
      <button class="iconbtn" id="fsBtn">⛶</button>
      <button class="iconbtn" id="pauseBtn">⏸️</button>
    </div>
    <div id="area">
      <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div><div id="stickHint" data-t="stick"></div></div>
      <div id="btnZone">
        <button class="pbtn" id="bJump"><span>⤒</span><b data-t="jump"></b></button>
        <button class="pbtn" id="bDive"><span>↘</span><b data-t="dive"></b></button>
        <button class="pbtn" id="bShoot"><span>⚽</span><b data-t="shoot"></b></button>
      </div>
    </div>
    <div id="navBar" class="hidden">
      <div class="tip" data-t="navTip"></div>
      <div class="row"><button id="nUp">▲</button><button id="nDown">▼</button></div>
      <div class="row"><button id="nBack">↩</button><button id="nOk" class="ok">OK</button></div>
    </div>
    <div id="overlay" class="hidden"><div class="spin"></div><div id="ovText"></div></div>
  </div>

<script>
(() => {
  // ===================== النصوص (عربي / إنجليزي) =====================
  const T = {
    ar: { title: 'الكرة ضد الحارس', sub: 'يد التحكم بالتلفون', code: 'رمز الغرفة (4 أرقام)', name: 'اسمك', rBall: '⚽ الكرة', rKeeper: '🧤 الحارس', join: 'انضمام', shoot: 'تسديد', jump: 'قفز', dive: 'غطس', stick: 'اسحب هنا للحركة',
      p1: 'اللاعب 1', p2: 'اللاعب 2', p3: 'اللاعب 3', p4: 'اللاعب 4', hostLbl: 'عنوان جهاز اللعبة (مثال 192.168.1.20:3000)', needHost: 'اكتب عنوان جهاز اللعبة الظاهر في غرفة الانتظار', navTip: 'تحكّم بالقوائم من هنا', ball: '⚽ الكرة', keeper: '🧤 الحارس', lobby: '⏳ الانتظار', reconnecting: 'انقطع الاتصال… جاري إعادة الاتصال', hostLost: 'شاشة اللعبة غير متصلة… بانتظارها', badRoom: 'رمز الغرفة غير صحيح', needCode: 'أدخل رمز الغرفة', connecting: 'جاري الاتصال…' },
    en: { title: 'BALL VS KEEPER', sub: 'Phone controller', code: 'Room code (4 digits)', name: 'Your name', rBall: '⚽ Ball', rKeeper: '🧤 Keeper', join: 'Join', shoot: 'SHOOT', jump: 'JUMP', dive: 'DIVE', stick: 'Drag here to move',
      p1: 'Player 1', p2: 'Player 2', p3: 'Player 3', p4: 'Player 4', hostLbl: 'Game device address (e.g. 192.168.1.20:3000)', needHost: 'Enter the game device address shown in the lobby', navTip: 'Control the menus from here', ball: '⚽ Ball', keeper: '🧤 Keeper', lobby: '⏳ Lobby', reconnecting: 'Connection lost… reconnecting', hostLost: 'Game screen offline… waiting', badRoom: 'Wrong room code', needCode: 'Enter the room code', connecting: 'Connecting…' }
  };
  const $ = (id) => document.getElementById(id);
  let lang = localStorage.getItem('bvk_pad_lang') || ((navigator.language || '').startsWith('ar') ? 'ar' : 'en');
  const tr = (k) => T[lang][k] || k;
  function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-t]').forEach((el) => (el.textContent = tr(el.dataset.t)));
    $('langBtn').textContent = lang === 'ar' ? 'EN' : 'ع';
    renderBar();
  }
  $('langBtn').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; localStorage.setItem('bvk_pad_lang', lang); applyLang(); };

  // ===================== الحالة =====================
  const params = new URLSearchParams(location.search);
  let id = localStorage.getItem('bvk_pad_id');
  if (!id) { id = Math.random().toString(36).slice(2, 10); localStorage.setItem('bvk_pad_id', id); }
  $('name').value = localStorage.getItem('bvk_pad_name') || ('📱 ' + id.slice(0, 3).toUpperCase());
  $('code').value = params.get('room') || localStorage.getItem('bvk_pad_room') || '';
  let rolePref = localStorage.getItem('bvk_pad_role') || null;
  let slot = -1, role = 'lobby', score = [0, 0];
  let ws = null, joined = false, wantJoin = false, retry = 0, hostOnline = true;
  const input = { x: 0, y: 0, s: false, j: false, d: false };
  const COLORS = ['#f97316', '#3b82f6', '#22c55e', '#e879f9'];
  let phase = 'idle';
  // وضع التطبيق (Capacitor): الصفحة محلية داخل التطبيق فنحتاج عنوان جهاز اللعبة
  const APP = !!window.Capacitor || location.protocol === 'file:' || location.protocol === 'capacitor:' || (location.hostname === 'localhost' && !location.port);
  if (APP) { $('hostField').classList.remove('hidden'); $('host').value = localStorage.getItem('bvk_pad_host') || ''; }

  function setRolePref(r) {
    rolePref = r; localStorage.setItem('bvk_pad_role', r);
    $('rBall').classList.toggle('on', r === 'ball');
    $('rKeeper').classList.toggle('on', r === 'keeper');
  }
  $('rBall').onclick = () => setRolePref('ball');
  $('rKeeper').onclick = () => setRolePref('keeper');
  if (rolePref) setRolePref(rolePref);
  $('pBall').onclick = () => { setRolePref('ball'); send({ t: 'role', role: 'ball' }); };
  $('pKeeper').onclick = () => { setRolePref('keeper'); send({ t: 'role', role: 'keeper' }); };

  function renderBar() {
    const c = COLORS[slot] || '#94a3b8';
    document.documentElement.style.setProperty('--pc', c);
    $('who').textContent = slot >= 0 && slot < 4 ? tr('p' + (slot + 1)) : '';
    $('role').textContent = tr(role === 'ball' ? 'ball' : role === 'keeper' ? 'keeper' : 'lobby');
    $('score').textContent = role === 'lobby' ? '' : score[0] + ' - ' + score[1];
    $('rolePick').classList.toggle('hidden', role !== 'lobby');
    $('navBar').classList.toggle('hidden', !(role === 'lobby' || phase === 'gameOver'));
    // تمييز الأزرار حسب الدور
    $('bShoot').classList.toggle('dim', role === 'keeper');
    $('bJump').classList.toggle('dim', role === 'ball');
    $('bDive').classList.toggle('dim', role === 'ball');
  }

  function showOverlay(text) { $('ovText').textContent = text; $('overlay').classList.remove('hidden'); }
  function hideOverlay() { $('overlay').classList.add('hidden'); }

  // ===================== الشبكة: WebSocket مع إعادة اتصال تلقائية =====================
  function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

  function connect() {
    let url;
    if (APP) {
      let h = $('host').value.trim().replace(/^(https?|wss?):\/\//, '').replace(/\/.*$/, '');
      if (h && !/:\d+$/.test(h)) h += ':3000';
      url = 'ws://' + h + '/ws';
    } else {
      url = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws';
    }
    try { ws = new WebSocket(url); } catch (e) { retry++; setTimeout(connect, Math.min(4000, 500 * retry)); return; }
    ws.onopen = () => {
      retry = 0;
      if (wantJoin) send({ t: 'join', code: $('code').value.trim(), id, name: $('name').value.trim(), role: rolePref });
    };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      switch (m.t) {
        case 'joined':
          joined = true; hostOnline = m.host;
          localStorage.setItem('bvk_pad_room', m.code);
          $('join').classList.add('hidden'); $('pad').classList.remove('hidden');
          if (hostOnline) hideOverlay(); else showOverlay(tr('hostLost'));
          vib(30); requestWake();
          break;
        case 'error':
          wantJoin = false; joined = false;
          $('pad').classList.add('hidden'); $('join').classList.remove('hidden');
          $('err').textContent = tr('badRoom');
          break;
        case 'slot': slot = m.slot; renderBar(); break;
        case 'state': role = m.role; phase = m.phase || phase; score = m.score || score; if (typeof m.me === 'number') slot = m.me; renderBar(); break;
        case 'vib': vib(m.p); break;
        case 'lang': if (T[m.lang] && !localStorage.getItem('bvk_pad_lang')) { lang = m.lang; applyLang(); } break;
        case 'host-lost': hostOnline = false; showOverlay(tr('hostLost')); break;
        case 'host-back': hostOnline = true; hideOverlay(); break;
      }
    };
    ws.onclose = () => {
      ws = null;
      $('dot').style.background = '#ef4444'; $('dot').style.boxShadow = '0 0 10px #ef4444';
      if (wantJoin) showOverlay(tr('reconnecting'));
      retry++;
      setTimeout(connect, Math.min(4000, 500 * retry));
    };
    ws.onerror = () => {};
  }
  // عند العودة للتطبيق بعد قفل الشاشة: أعد الاتصال فوراً
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && (!ws || ws.readyState > 1)) { retry = 0; connect(); }
    if (!document.hidden) requestWake();
  });

  function doJoin() {
    const code = $('code').value.trim();
    if (!/^\d{4}$/.test(code)) { $('err').textContent = tr('needCode'); return; }
    $('err').textContent = '';
    localStorage.setItem('bvk_pad_name', $('name').value.trim());
    if (APP) {
      if (!$('host').value.trim()) { $('err').textContent = tr('needHost'); return; }
      localStorage.setItem('bvk_pad_host', $('host').value.trim());
      wantJoin = true;
      if (ws) { ws.onclose = null; try { ws.close(); } catch (e) {} ws = null; }
      retry = 0; connect();
      return;
    }
    wantJoin = true;
    if (ws && ws.readyState === 1) send({ t: 'join', code, id, name: $('name').value.trim(), role: rolePref });
    else if (!ws) connect();
  }
  $('go').onclick = doJoin;
  // أزرار التنقل في القوائم (غرفة الانتظار / نهاية المباراة)
  [['nUp', 'up'], ['nDown', 'down'], ['nOk', 'ok'], ['nBack', 'back']].forEach(([b, k]) => { $(b).onclick = () => { send({ t: 'nav', k }); vib(15); }; });

  // ===================== اهتزاز وشاشة دائمة التشغيل =====================
  function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
  let wake = null;
  async function requestWake() { try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => (wake = null)); } } catch (e) {} }
  $('fsBtn').onclick = () => { const d = document.documentElement; (d.requestFullscreen || d.webkitRequestFullscreen || (() => {})).call(d); try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} };
  $('pauseBtn').onclick = () => { send({ t: 'pause' }); vib(20); };

  // ===================== العصا الافتراضية (لمس متعدد) =====================
  const zone = $('stickZone'), base = $('stickBase'), knob = $('stickKnob');
  let stickId = null, ox = 0, oy = 0;
  const R = 70;
  zone.addEventListener('pointerdown', (e) => {
    if (stickId !== null) return;
    stickId = e.pointerId; zone.setPointerCapture(e.pointerId);
    const r = zone.getBoundingClientRect();
    ox = e.clientX; oy = e.clientY;
    base.style.left = (e.clientX - r.left) + 'px'; base.style.top = (e.clientY - r.top) + 'px';
    moveStick(e);
  });
  function moveStick(e) {
    let dx = e.clientX - ox, dy = e.clientY - oy;
    const d = Math.hypot(dx, dy);
    if (d > R) { dx = dx / d * R; dy = dy / d * R; }
    knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    let nx = dx / R, ny = -dy / R;
    // Dead-zone near the center prevents unwanted drift on touchscreens.
    const mag = Math.hypot(nx, ny);
    if (mag < 0.09) { nx = 0; ny = 0; }
    else { const scaled = Math.min(1, (mag - 0.09) / 0.91) / mag; nx *= scaled; ny *= scaled; }
    input.x = +nx.toFixed(3); input.y = +ny.toFixed(3);
  }
  zone.addEventListener('pointermove', (e) => { if (e.pointerId === stickId) moveStick(e); });
  const endStick = (e) => { if (e.pointerId !== stickId) return; stickId = null; input.x = 0; input.y = 0; knob.style.transform = ''; };
  zone.addEventListener('pointerup', endStick);
  zone.addEventListener('pointercancel', endStick);

  // ===================== الأزرار =====================
  function bindBtn(el, key) {
    const ids = new Set();
    const set = () => { input[key] = ids.size > 0; el.classList.toggle('down', ids.size > 0); };
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); el.setPointerCapture(e.pointerId); ids.add(e.pointerId); set(); vib(12); });
    const up = (e) => { ids.delete(e.pointerId); set(); };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('lostpointercapture', up);
  }
  bindBtn($('bShoot'), 's');
  bindBtn($('bJump'), 'j');
  bindBtn($('bDive'), 'd');

  // ===================== إرسال المدخلات (40 مرة بالثانية) =====================
  let lastSent = '', lastTime = 0;
  setInterval(() => {
    if (!joined || !ws || ws.readyState !== 1) return;
    $('dot').style.background = '#22c55e'; $('dot').style.boxShadow = '0 0 10px #22c55e';
    if (hostOnline) hideOverlay();
    const msg = JSON.stringify({ t: 'in', x: input.x, y: input.y, s: input.s ? 1 : 0, j: input.j ? 1 : 0, d: input.d ? 1 : 0 });
    const now = Date.now();
    // إرسال عند التغيير أو كل 100ms كنبض
    if (msg !== lastSent || now - lastTime > 100) { ws.send(msg); lastSent = msg; lastTime = now; }
  }, 25);

  // منع الإيماءات (تكبير / قائمة) على iOS
  ['gesturestart', 'gesturechange', 'contextmenu', 'dblclick'].forEach((ev) => document.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', (e) => { if (!e.target.closest('#join')) e.preventDefault(); }, { passive: false });

  applyLang();
  if (!APP) connect();
